<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶檔案</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --surface2: #1e2330;
    --border: #2a2f3d;
    --accent: #e8c547;
    --accent2: #4ecdc4;
    --success: #52d68a;
    --danger: #ff6b6b;
    --purple: #a78bfa;
    --text: #e8eaf0;
    --text-dim: #6b7280;
    --text-muted: #3d4455;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .wrapper { max-width: 720px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 32px; animation: fadeDown 0.5s ease; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--text-dim); text-decoration: none;
    margin-bottom: 16px; transition: color 0.2s;
  }
  .back-btn:hover { color: var(--accent); }
  .client-name { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .client-name span { color: var(--accent); }
  .client-meta { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .tag {
    font-family: 'DM Mono', monospace; font-size: 11px;
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .tag.stage { border-color: var(--accent); color: var(--accent); }
  .tag.prob-high { border-color: var(--success); color: var(--success); }
  .tag.prob-mid { border-color: var(--accent); color: var(--accent); }
  .tag.prob-low { border-color: var(--danger); color: var(--danger); }

  /* Loading */
  .loading {
    text-align: center; padding: 80px 20px;
    font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-dim);
  }
  .spinner {
    width: 32px; height: 32px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }

  /* Section */
  .section { margin-bottom: 24px; animation: fadeUp 0.4s ease both; }
  .section:nth-child(2) { animation-delay: 0.05s; }
  .section:nth-child(3) { animation-delay: 0.1s; }
  .section:nth-child(4) { animation-delay: 0.15s; }

  .section-label {
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-num { color: var(--accent); font-size: 10px; }

  /* 客戶卡 唯讀 */
  .info-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .info-item {}
  .info-item.full { grid-column: 1 / -1; }
  .info-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .info-value {
    font-size: 14px; color: var(--text);
    min-height: 22px;
  }
  .info-value.empty { color: var(--text-muted); font-style: italic; font-size: 13px; }

  /* 時間指標 */
  .time-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .time-badge {
    flex: 1; min-width: 120px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; text-align: center;
  }
  .time-badge .num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--accent); }
  .time-badge .num.warn { color: var(--danger); }
  .time-badge .label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* AI 分析區 */
  .ai-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .ai-context-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .ctx-tab {
    flex: 1; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface2);
    color: var(--text-dim); font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; text-align: center; transition: all 0.2s;
  }
  .ctx-tab.active { border-color: var(--purple); background: rgba(167,139,250,0.1); color: var(--purple); }

  .btn-ai {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
  }
  .btn-ai:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .ai-result { display: none; }
  .ai-result.show { display: block; }

  .ai-row {
    display: flex; gap: 10px; margin-bottom: 10px;
    padding: 12px 14px; background: var(--surface2);
    border-radius: 8px; border-left: 3px solid var(--purple);
    align-items: flex-start;
  }
  .ai-row-label {
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--purple); min-width: 80px; padding-top: 1px;
  }
  .ai-row-value { font-size: 14px; color: var(--text); line-height: 1.6; flex: 1; }

  .prob-badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .prob-高 { background: rgba(82,214,138,0.15); color: var(--success); }
  .prob-中 { background: rgba(232,197,71,0.15); color: var(--accent); }
  .prob-低 { background: rgba(255,107,107,0.15); color: var(--danger); }

  .ai-save-btn {
    width: 100%; padding: 11px;
    background: transparent; border: 1px solid var(--purple);
    color: var(--purple); border-radius: 8px; font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: all 0.2s; margin-top: 8px;
  }
  .ai-save-btn:hover { background: rgba(167,139,250,0.1); }

  /* 快速更新區 */
  .update-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }

  label { font-size: 12px; color: var(--text-dim); }

  input, select, textarea {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'Noto Sans TC', sans-serif; font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color 0.2s; width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.6; }

  .stage-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .stage-btn {
    flex: 1; min-width: 70px; padding: 8px 4px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface2); color: var(--text-dim);
    font-size: 12px; font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; text-align: center; transition: all 0.2s;
  }
  .stage-btn.active { border-color: var(--accent); background: rgba(232,197,71,0.1); color: var(--accent); }

  .btn-update {
    width: 100%; padding: 13px; background: var(--accent);
    color: #0d0f14; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: all 0.2s; margin-top: 16px;
  }
  .btn-update:hover { background: #f0d160; transform: translateY(-1px); }
  .btn-update:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Toast */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--success);
    border-radius: 12px; padding: 12px 24px;
    font-size: 14px; color: var(--success);
    transition: transform 0.3s ease; z-index: 100;
    white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* Animations */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 560px) {
    .grid-2 { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .time-badges { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <!-- Loading 狀態 -->
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    載入客戶資料中...
  </div>

  <!-- 主內容（載入後顯示） -->
  <div id="mainContent" style="display:none;">

    <!-- Header -->
    <div class="header">
      <a href="crm-input.html" class="back-btn">← 返回新增</a>
      <div class="client-name" id="headerName">客戶名稱</div>
      <div class="client-meta" id="headerMeta"></div>
    </div>

    <!-- 01 客戶資料 -->
    <div class="section">
      <div class="section-label"><span class="section-num">01</span> 客戶資料</div>
      <div class="info-card">
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">職業</div>
            <div class="info-value" id="v-job">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">居住地</div>
            <div class="info-value" id="v-location">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">熟識程度</div>
            <div class="info-value" id="v-familiarity">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">決策風格</div>
            <div class="info-value" id="v-decision">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">收入預估</div>
            <div class="info-value" id="v-income">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">投資工具</div>
            <div class="info-value" id="v-tools">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">資金屬性</div>
            <div class="info-value" id="v-fund">—</div>
          </div>
          <div class="info-item">
            <div class="info-label">房狀態</div>
            <div class="info-value" id="v-house">—</div>
          </div>
          <div class="info-item full">
            <div class="info-label">痛點 / 備註</div>
            <div class="info-value" id="v-pain">—</div>
          </div>
          <div class="info-item full">
            <div class="info-label">我收集的配置需求</div>
            <div class="info-value" id="v-config">—</div>
          </div>
          <div class="info-item full">
            <div class="info-label">上次互動氛圍 / 卡住原因</div>
            <div class="info-value" id="v-vibe">—</div>
          </div>
        </div>

        <!-- 時間指標 -->
        <div class="time-badges">
          <div class="time-badge">
            <div class="num" id="t-since">—</div>
            <div class="label">距上次聯繫（天）</div>
          </div>
          <div class="time-badge">
            <div class="num" id="t-stage">—</div>
            <div class="label">階段停留（天）</div>
          </div>
          <div class="time-badge">
            <div class="num" id="t-overdue">—</div>
            <div class="label">跟進逾期（天）</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 02 AI 分析 -->
    <div class="section">
      <div class="section-label"><span class="section-num">02</span> AI 分析</div>
      <div class="ai-card">
        <div class="ai-context-tabs">
          <button class="ctx-tab active" data-ctx="行動前" onclick="setContext(this)">🎯 行動前（準備聯繫）</button>
          <button class="ctx-tab" data-ctx="行動後" onclick="setContext(this)">📝 行動後（更新評估）</button>
        </div>
        <button class="btn-ai" id="aiBtn" onclick="runAI()">✨ 請 AI 分析</button>
        <div class="ai-result" id="aiResult"></div>
      </div>
    </div>

    <!-- 03 快速更新 -->
    <div class="section">
      <div class="section-label"><span class="section-num">03</span> 快速更新</div>
      <div class="update-card">
        <div class="grid-2">
          <div class="field full">
            <label>目前階段</label>
            <div class="stage-group" id="stageGroup">
              <button class="stage-btn" data-stage="潛在" onclick="setStage(this)">潛在</button>
              <button class="stage-btn" data-stage="預約" onclick="setStage(this)">預約</button>
              <button class="stage-btn" data-stage="簡報" onclick="setStage(this)">簡報</button>
              <button class="stage-btn" data-stage="跟進" onclick="setStage(this)">跟進</button>
              <button class="stage-btn" data-stage="成交" onclick="setStage(this)">成交</button>
            </div>
            <input type="hidden" id="u-stage">
          </div>
          <div class="field">
            <label>最後聯繫日</label>
            <input type="date" id="u-lastContact">
          </div>
          <div class="field">
            <label>下次跟進日</label>
            <input type="date" id="u-nextFollow">
          </div>
          <div class="field">
            <label>上次互動氛圍</label>
            <select id="u-vibe">
              <option value="">— 選擇 —</option>
              <option value="熱絡">熱絡</option>
              <option value="普通">普通</option>
              <option value="冷淡">冷淡</option>
              <option value="有防備">有防備</option>
              <option value="主動詢問">主動詢問</option>
            </select>
          </div>
          <div class="field">
            <label>預計成交日</label>
            <input type="date" id="u-targetClose">
          </div>
          <div class="field full">
            <label>上次卡住的原因</label>
            <input type="text" id="u-stuck" placeholder="說要問老婆 / 覺得金額太大...">
          </div>
          <div class="field full">
            <label>痛點補充</label>
            <textarea id="u-pain" placeholder="這次接觸新發現的痛點或需求..."></textarea>
          </div>
          <div class="field full">
            <label>配置需求補充</label>
            <textarea id="u-config" placeholder="更新的配置意向..."></textarea>
          </div>
        </div>
        <button class="btn-update" id="updateBtn" onclick="submitUpdate()">更新客戶資料 →</button>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const WEBHOOK_B = 'https://ydj.zeabur.app/webhook/90e38165-cd18-4dd0-85a4-c64a707aaf72';

  let clientData = {};
  let currentContext = '行動前';
  let aiResultData = null;

  // ── 從 URL 取得客戶名稱 ──────────────────────────
  function getNameFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('name') || '';
  }

  // ── 載入客戶資料 ─────────────────────────────────
  async function loadClient(name) {
    try {
      const res = await fetch(WEBHOOK_B, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'load', 姓名代稱: name })
      });
      const data = await res.json();
      if (data.success && data.data) {
        clientData = data.data;
        renderClient(clientData);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } else {
        document.getElementById('loadingState').innerHTML = '<p style="color:var(--danger)">找不到此客戶資料</p>';
      }
    } catch(e) {
      document.getElementById('loadingState').innerHTML = '<p style="color:var(--danger)">載入失敗：' + e.message + '</p>';
    }
  }

  // ── 渲染客戶資料 ─────────────────────────────────
  function renderClient(d) {
    const val = (v) => v || '<span class="empty">未填寫</span>';

    document.getElementById('headerName').innerHTML = d['姓名/代稱'] || '未知客戶';

    // Meta tags
    const meta = document.getElementById('headerMeta');
    const stage = d['階段'] || '';
    const prob = d['成交機率'] || '';
    meta.innerHTML = `
      ${stage ? `<span class="tag stage">${stage}</span>` : ''}
      ${d['職業'] ? `<span class="tag">${d['職業']}</span>` : ''}
      ${d['熟識程度'] ? `<span class="tag">熟識 ${d['熟識程度']}</span>` : ''}
      ${prob ? `<span class="tag prob-${prob}">${prob}成交機率</span>` : ''}
    `;

    // 資料欄位
    document.getElementById('v-job').innerHTML = val(d['職業']);
    document.getElementById('v-location').innerHTML = val(d['居住地']);
    document.getElementById('v-familiarity').innerHTML = val(d['熟識程度']);
    document.getElementById('v-decision').innerHTML = val(d['決策風格']);
    document.getElementById('v-income').innerHTML = d['收入預估'] ? d['收入預估'] + ' 萬/年' : '<span class="empty">未填寫</span>';
    document.getElementById('v-tools').innerHTML = val(d['投資工具']);
    document.getElementById('v-fund').innerHTML = val(d['流量/存量']);
    document.getElementById('v-house').innerHTML = val(d['房狀態']);
    document.getElementById('v-pain').innerHTML = val(d['痛點/備註']);
    document.getElementById('v-config').innerHTML = val(d['我收集的配置需求']);

    const vibe = [d['上次互動氛圍'], d['上次卡住的原因']].filter(Boolean).join(' ／ ');
    document.getElementById('v-vibe').innerHTML = val(vibe);

    // 時間指標
    const since = d['距上次聯繫天數'];
    const stageDay = d['階段停留天數'];
    const overdue = d['跟進逾期天數'];

    const sinceEl = document.getElementById('t-since');
    sinceEl.textContent = since !== undefined && since !== '' ? since : '—';
    if (since > 14) sinceEl.classList.add('warn');

    document.getElementById('t-stage').textContent = stageDay !== undefined && stageDay !== '' ? stageDay : '—';

    const overdueEl = document.getElementById('t-overdue');
    overdueEl.textContent = overdue !== undefined && overdue !== '' ? overdue : '—';
    if (overdue > 0) overdueEl.classList.add('warn');

    // 預填更新區
    document.getElementById('u-lastContact').value = d['最後聯繫日'] || '';
    document.getElementById('u-nextFollow').value = d['下次跟進日'] || '';
    document.getElementById('u-targetClose').value = d['預計成交日'] || '';
    document.getElementById('u-vibe').value = d['上次互動氛圍'] || '';
    document.getElementById('u-stuck').value = d['上次卡住的原因'] || '';

    // 預選階段
    if (stage) {
      document.querySelectorAll('.stage-btn').forEach(btn => {
        if (btn.dataset.stage === stage) {
          btn.classList.add('active');
          document.getElementById('u-stage').value = stage;
        }
      });
    }

    // 如果有 AI 推薦配置，顯示
    if (d['AI推薦配置'] || d['下一步行動']) {
      renderAIResult({
        成交機率: d['成交機率'],
        AI推薦配置: d['AI推薦配置'],
        下一步行動: d['下一步行動']
      });
    }
  }

  // ── AI 情境切換 ──────────────────────────────────
  function setContext(el) {
    document.querySelectorAll('.ctx-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentContext = el.dataset.ctx;
  }

  // ── 執行 AI 分析 ─────────────────────────────────
  async function runAI() {
    const btn = document.getElementById('aiBtn');
    btn.disabled = true;
    btn.textContent = '分析中...';
    document.getElementById('aiResult').className = 'ai-result';

    try {
      const res = await fetch(WEBHOOK_B, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'ai',
          姓名代稱: clientData['姓名/代稱'],
          情境: currentContext,
          客戶資料: clientData
        })
      });
      const data = await res.json();
      if (data.success && data.result) {
        aiResultData = data.result;
        renderAIResult(data.result);
      } else {
        showToast('AI 分析失敗', true);
      }
    } catch(e) {
      showToast('錯誤：' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ 重新分析';
    }
  }

  // ── 渲染 AI 結果 ─────────────────────────────────
  function renderAIResult(result) {
    if (!result) return;
    const el = document.getElementById('aiResult');
    const probClass = result['成交機率'] ? `prob-${result['成交機率']}` : '';

    let html = '';
    if (result['成交機率']) {
      html += `<div class="ai-row"><div class="ai-row-label">成交機率</div><div class="ai-row-value"><span class="prob-badge ${probClass}">${result['成交機率']}</span></div></div>`;
    }
    if (result['AI推薦配置']) {
      html += `<div class="ai-row"><div class="ai-row-label">推薦配置</div><div class="ai-row-value">${result['AI推薦配置']}</div></div>`;
    }
    if (result['下一步行動']) {
      html += `<div class="ai-row"><div class="ai-row-label">下一步</div><div class="ai-row-value">${result['下一步行動']}</div></div>`;
    }
    if (result['開場建議']) {
      html += `<div class="ai-row"><div class="ai-row-label">開場建議</div><div class="ai-row-value">${result['開場建議']}</div></div>`;
    }
    if (result['注意事項']) {
      html += `<div class="ai-row"><div class="ai-row-label">注意事項</div><div class="ai-row-value">${result['注意事項']}</div></div>`;
    }
    if (result['評估變化']) {
      html += `<div class="ai-row"><div class="ai-row-label">評估變化</div><div class="ai-row-value">${result['評估變化']}</div></div>`;
    }
    if (result['風險提醒']) {
      html += `<div class="ai-row"><div class="ai-row-label">風險提醒</div><div class="ai-row-value">${result['風險提醒']}</div></div>`;
    }
    if (result['error']) {
      html += `<div class="ai-row"><div class="ai-row-label">錯誤</div><div class="ai-row-value" style="color:var(--danger)">${result['error']}</div></div>`;
    }

    html += `<button class="ai-save-btn" onclick="saveAIResult()">💾 寫入 Sheets</button>`;
    el.innerHTML = html;
    el.className = 'ai-result show';
  }

  // ── 儲存 AI 結果到 Sheets ────────────────────────
  async function saveAIResult() {
    if (!aiResultData) return;
    try {
      const res = await fetch(WEBHOOK_B, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'update',
          姓名代稱: clientData['姓名/代稱'],
          AI推薦配置: aiResultData['AI推薦配置'] || '',
          下一步行動: aiResultData['下一步行動'] || '',
          成交機率: aiResultData['成交機率'] || ''
        })
      });
      const data = await res.json();
      if (data.success) showToast('✓ AI 結果已寫入 Sheets');
      else showToast('寫入失敗', true);
    } catch(e) {
      showToast('錯誤：' + e.message, true);
    }
  }

  // ── 階段選擇 ─────────────────────────────────────
  function setStage(el) {
    document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('u-stage').value = el.dataset.stage;
  }

  // ── 送出更新 ─────────────────────────────────────
  async function submitUpdate() {
    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.textContent = '更新中...';

    const body = {
      action: 'update',
      姓名代稱: clientData['姓名/代稱'],
      階段: document.getElementById('u-stage').value || clientData['階段'],
      最後聯繫日: document.getElementById('u-lastContact').value,
      下次跟進日: document.getElementById('u-nextFollow').value,
      預計成交日: document.getElementById('u-targetClose').value,
      上次互動氛圍: document.getElementById('u-vibe').value,
      上次卡住的原因: document.getElementById('u-stuck').value,
      痛點備註: document.getElementById('u-pain').value || clientData['痛點/備註'],
      我收集的配置需求: document.getElementById('u-config').value || clientData['我收集的配置需求']
    };

    try {
      const res = await fetch(WEBHOOK_B, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.success) {
        showToast('✓ 資料已更新');
        setTimeout(() => location.reload(), 1500);
      } else {
        showToast('更新失敗', true);
      }
    } catch(e) {
      showToast('錯誤：' + e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = '更新客戶資料 →';
    }
  }

  // ── Toast ────────────────────────────────────────
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── 初始化 ───────────────────────────────────────
  const clientName = getNameFromURL();
  if (clientName) {
    loadClient(clientName);
  } else {
    document.getElementById('loadingState').innerHTML = '<p style="color:var(--danger)">未指定客戶，請從列表進入</p>';
  }
</script>
</body>
</html>
