<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正字記數 Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans TC', sans-serif; background: #f5f4f0; padding: 20px; color: #1a1a2e; }
h2 { margin-bottom: 14px; font-size: 15px; font-weight: 700; }
h3 { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

.panel { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
.controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.ctrl { display: flex; flex-direction: column; gap: 5px; }
.ctrl label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }
.ctrl input[type=range] { width: 140px; accent-color: #1a1a2e; }
.val { font-size: 12px; font-weight: 700; color: #1a1a2e; text-align: center; font-family: 'JetBrains Mono', monospace; }

/* 比較區 */
.compare-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.style-card { border: 1.5px solid #e0ddd6; border-radius: 10px; padding: 14px; cursor: pointer; transition: all 0.15s; }
.style-card:hover { border-color: #1a1a2e; }
.style-card.active { border-color: #1a1a2e; background: #f8f7f4; }
.style-card-title { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.style-card-preview { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 2.4; }

/* 情境預覽 */
.ctx-line { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 2.8; }
.ctx-line-wrap { line-height: 2.4; max-width: 280px; }
</style>
</head>
<body>

<h2>正字記數 框框樣式 Demo</h2>

<!-- 控制 -->
<div class="panel">
  <div class="controls">
    <div class="ctrl">
      <label>SVG W</label>
      <input type="range" id="wSlider" min="6" max="60" value="19" oninput="update()">
      <div class="val" id="wVal">19</div>
    </div>
    <div class="ctrl">
      <label>SVG H</label>
      <input type="range" id="hSlider" min="6" max="65" value="16" oninput="update()">
      <div class="val" id="hVal">16</div>
    </div>
    <div class="ctrl">
      <label>正 大小</label>
      <input type="range" id="fsSlider" min="6" max="40" value="16" oninput="update()">
      <div class="val" id="fsVal">16px</div>
    </div>
    <div class="ctrl">
      <label>筆畫</label>
      <input type="range" id="swSlider" min="0.5" max="6" step="0.5" value="4" oninput="update()">
      <div class="val" id="swVal">4</div>
    </div>
    <div class="ctrl">
      <label>L 顏色</label>
      <input type="color" id="colorL" value="#4CAF50" oninput="update()">
    </div>
    <div class="ctrl">
      <label>C 顏色</label>
      <input type="color" id="colorC" value="#FF9800" oninput="update()">
    </div>
  </div>
</div>

<!-- 樣式比較 -->
<div class="panel">
  <h3>選擇框框樣式（點選）</h3>
  <div class="compare-grid" id="styleGrid"></div>
</div>

<!-- 情境預覽 -->
<div class="panel">
  <h3>情境預覽 — 組件欄實際排版</h3>
  <div class="ctx-line-wrap" id="ctxWrap"></div>
</div>

<script>
function svgZheng(strokes, W, H, sw, color) {
  const d = [
    `<line x1="3" y1="5" x2="25" y2="5" stroke-width="${sw}" stroke-linecap="round"/>`,
    `<line x1="14" y1="5" x2="14" y2="27" stroke-width="${sw}" stroke-linecap="round"/>`,
    `<line x1="14" y1="16" x2="25" y2="16" stroke-width="${sw}" stroke-linecap="round"/>`,
    `<line x1="3" y1="16" x2="3" y2="27" stroke-width="${sw}" stroke-linecap="round"/>`,
  ];
  let p = ''; for (let i=0;i<strokes;i++) p+=d[i];
  return `<svg width="${W}" height="${H}" viewBox="0 0 28 30" style="display:inline-block;vertical-align:middle" stroke="${color}" fill="none">${p}</svg>`;
}

function zhengSymbol(n, W, H, fs, sw, color) {
  if (n <= 0) return '—';
  const full = Math.floor(n/5), rem = n%5;
  let h = '';
  for (let i=0;i<full;i++) h += `<b style="font-size:${fs}px;color:${color};">正</b>`;
  if (rem > 0) h += svgZheng(rem, W, H, sw, color);
  return h;
}

// 6種框框樣式
const STYLES = [
  {
    id: 'none',
    title: '無框（現在）',
    wrap: (len, zheng, color) =>
      `<span style="white-space:nowrap;display:inline-block;"><span style="font-family:'JetBrains Mono',monospace;font-size:13px;">${len}</span>×${zheng}</span>`
  },
  {
    id: 'border',
    title: '細框線',
    wrap: (len, zheng, color) =>
      `<span style="white-space:nowrap;display:inline-block;border:1.5px solid ${color};border-radius:6px;padding:1px 6px;">`+
      `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;">${len}</span> ${zheng}</span>`
  },
  {
    id: 'fill-light',
    title: '淡底色',
    wrap: (len, zheng, color) =>
      `<span style="white-space:nowrap;display:inline-block;background:${color}22;border-radius:6px;padding:1px 6px;">`+
      `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;">${len}</span> ${zheng}</span>`
  },
  {
    id: 'fill-border',
    title: '淡底 + 框線',
    wrap: (len, zheng, color) =>
      `<span style="white-space:nowrap;display:inline-block;background:${color}18;border:1.5px solid ${color}88;border-radius:6px;padding:1px 6px;">`+
      `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;">${len}</span> ${zheng}</span>`
  },
  {
    id: 'pill',
    title: 'Pill 膠囊',
    wrap: (len, zheng, color) =>
      `<span style="white-space:nowrap;display:inline-block;background:${color}18;border:1.5px solid ${color}88;border-radius:20px;padding:1px 8px;">`+
      `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;">${len}</span> ${zheng}</span>`
  },
  {
    id: 'solid',
    title: '實底白字',
    wrap: (len, zheng, color) => {
      const zhengW = zheng.replace(new RegExp(`color:${color}`, 'g'), 'color:white').replace(/stroke="[^"]*"/g, `stroke="white"`);
      return `<span style="white-space:nowrap;display:inline-block;background:${color};border-radius:6px;padding:1px 7px;color:white;">`+
        `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:white;">${len}</span> ${zhengW}</span>`;
    }
  },
];

let activeStyle = 0;

function buildContext(styleIdx) {
  const W = +wSlider.value, H = +hSlider.value, fs = +fsSlider.value, sw = +swSlider.value;
  const cL = colorL.value, cC = colorC.value;
  const s = STYLES[styleIdx];
  const dot = `<span style="color:#bbb;margin:0 2px;">·</span>`;

  const L_entries = [
    [16, 1, cL], [18, 4, cL], [20, 3, cL], [22, 1, cL], [26, 6, cL], [30, 2, cL], [34, 1, cL]
  ].map(([len, n, c]) => s.wrap(len, zhengSymbol(n,W,H,fs,sw,c), c));

  const C_entries = [
    [22, 2, cC], [26, 3, cC], [30, 1, cC]
  ].map(([len, n, c]) => s.wrap(len, zhengSymbol(n,W,H,fs,sw,c), c));

  const Ltagged = L_entries.map((e,i)=>i<L_entries.length-1?e+dot:e).join(' ');
  const Ctagged = C_entries.map((e,i)=>i<C_entries.length-1?e+dot:e).join(' ');

  return `<div style="line-height:2.6;font-family:'JetBrains Mono',monospace;">
    <span style="font-weight:700;color:${cL};">2.4 L:</span> ${Ltagged}<br>
    <span style="font-weight:700;color:${cC};">2.4 C:</span> ${Ctagged}
  </div>`;
}

function buildCard(styleIdx) {
  const W = +wSlider.value, H = +hSlider.value, fs = +fsSlider.value, sw = +swSlider.value;
  const cL = colorL.value, cC = colorC.value;
  const s = STYLES[styleIdx];
  const dot = `<span style="color:#bbb;margin:0 1px;">·</span>`;
  const samples = [[16,1,cL],[18,4,cL],[9,3,cC]];
  const items = samples.map(([len,n,c])=>s.wrap(len,zhengSymbol(n,W,H,fs,sw,c),c));
  const preview = items.map((e,i)=>i<items.length-1?e+dot:e).join(' ');
  const isActive = styleIdx === activeStyle;
  return `<div class="style-card${isActive?' active':''}" onclick="selectStyle(${styleIdx})">
    <div class="style-card-title">${s.title}</div>
    <div class="style-card-preview">${preview}</div>
  </div>`;
}

function selectStyle(idx) {
  activeStyle = idx;
  update();
}

function update() {
  document.getElementById('wVal').textContent  = wSlider.value;
  document.getElementById('hVal').textContent  = hSlider.value;
  document.getElementById('fsVal').textContent = fsSlider.value + 'px';
  document.getElementById('swVal').textContent = swSlider.value;

  document.getElementById('styleGrid').innerHTML = STYLES.map((_,i) => buildCard(i)).join('');
  document.getElementById('ctxWrap').innerHTML = buildContext(activeStyle);
}

const wSlider = document.getElementById('wSlider');
const hSlider = document.getElementById('hSlider');
const fsSlider = document.getElementById('fsSlider');
const swSlider = document.getElementById('swSlider');
const colorL = document.getElementById('colorL');
const colorC = document.getElementById('colorC');

update();
</script>
</body>
</html>
