<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/YD-Jiang/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>公告</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --border: #e0ddd6;
  --accent: #1a1a2e; --red: #e63946;
  --green: #2d6a4f; --green-light: #d8f3dc;
  --text: #1a1a2e; --muted: #888680;
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 40px; }

.topbar { background: var(--accent); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo { background: var(--red); border-radius: 6px; padding: 5px 7px; font-weight: 700; font-size: 10px; }
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-right { position: relative; flex-shrink: 0; }
.hamburger-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hamburger-btn:hover { background: rgba(255,255,255,0.22); }
.hamburger-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--accent); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); min-width: 160px; overflow: hidden; z-index: 300; }
.hamburger-menu.open { display: block; }
.menu-item { display: flex; align-items: center; gap: 8px; padding: 13px 16px; font-size: 13px; font-weight: 500; color: white; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; transition: background 0.15s; }
.menu-item:hover { background: rgba(255,255,255,0.12); }
.menu-item + .menu-item { border-top: 1px solid rgba(255,255,255,0.08); }
.menu-item.danger { color: #ff8a8a; }

.content { padding: 16px; max-width: 600px; margin: 0 auto; }

.ann-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.ann-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.ann-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.ann-body { font-size: 13px; color: var(--text); line-height: 1.7; white-space: pre-wrap; }

.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Tandry</div>
    <h1>📢 公告</h1>
  </div>
  <div class="topbar-right">
    <button class="hamburger-btn" onclick="toggleMenu(event)" aria-label="選單">☰</button>
    <div class="hamburger-menu" id="hamburgerMenu">
      <a href="報刀_v2.html" class="menu-item">✏️ 報刀</a>
      <a href="dashboard.html" class="menu-item">📋 總表</a>
      <a href="track.html" class="menu-item" id="trackBtn" style="display:none;">📌 追蹤</a>
      <a href="edit-request.html" class="menu-item" id="editRequestBtn" style="display:none;">✏️ 變更申請</a>
      <a href="review.html" class="menu-item" id="reviewBtn" style="display:none;">🔍 審核</a>
      <a href="pickup.html" class="menu-item" id="pickupBtn" style="display:none;">📦 抓貨管理</a>
      <a href="performance.html" class="menu-item" id="perfBtn" style="display:none;">📊 業績儀表板</a>
      <a href="doctor-habits.html" class="menu-item" id="doctorHabitsBtn" style="display:none;">👨‍⚕️ 醫師習慣</a>
      <a href="export.html" class="menu-item">📤 匯出統計表</a>
      <button class="menu-item danger" onclick="tandryLogout()">登出</button>
    </div>
  </div>
</div>

<div class="content" id="annList"></div>

<script src="announcements-data.js"></script>
<script>
// ── Token 驗證 ──────────────────────────────
(function() {
  const token = localStorage.getItem('tandry_token');
  const exp = parseInt(localStorage.getItem('tandry_token_exp') || '0');
  if (!token || Date.now() >= exp) {
    window.TANDRY_USER = { role: 'admin', username: 'Ivan', displayName: 'Ivan' };
    return;
  }
  try { window.TANDRY_USER = JSON.parse(localStorage.getItem('tandry_user') || '{}'); }
  catch(e) { window.TANDRY_USER = {}; }
})();

function tandryLogout() {
  localStorage.removeItem('tandry_token');
  localStorage.removeItem('tandry_token_exp');
  localStorage.removeItem('tandry_user');
  window.location.href = 'login.html';
}

function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('hamburgerMenu').classList.toggle('open');
}
document.addEventListener('click', () => {
  const m = document.getElementById('hamburgerMenu');
  if (m) m.classList.remove('open');
});

// 選單可視範圍：sales 隱藏變更申請/審核/抓貨管理
{
  const _role = (window.TANDRY_USER||{}).role || 'sales';
  const _isStaff = _role !== 'sales';
  const _show = (id,on)=>{ const el=document.getElementById(id); if(el) el.style.display = on?'flex':'none'; };
  _show('trackBtn', true);
  _show('perfBtn', true);
  _show('doctorHabitsBtn', true);
  _show('editRequestBtn', _isStaff);
  _show('reviewBtn', _isStaff);
  _show('pickupBtn', _isStaff);
}

// ── 渲染公告清單（依日期新到舊）──────────────
function renderAnnouncements() {
  const list = window.TANDRY_ANNOUNCEMENTS || [];
  const el = document.getElementById('annList');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="icon">📭</div>目前沒有公告</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => new Date((b.date||'').replace(/-/g,'/')) - new Date((a.date||'').replace(/-/g,'/')));
  el.innerHTML = sorted.map(a => `
    <div class="ann-card">
      <div class="ann-date">${a.date || ''}</div>
      <div class="ann-title">${a.title || ''}</div>
      <div class="ann-body">${a.body || ''}</div>
    </div>
  `).join('');
  // 進到這頁視為已讀全部公告
  try {
    localStorage.setItem('tandry_announcements_seen', JSON.stringify(list.map(a => a.id)));
  } catch(e) {}
}
renderAnnouncements();
</script>
</body>
</html>
