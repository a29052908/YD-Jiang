<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/YD-Jiang/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>變更審核</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --border: #e0ddd6;
  --accent: #1a1a2e; --red: #e63946;
  --green: #2d6a4f; --green-light: #d8f3dc;
  --blue: #3a5bd9; --blue-light: #e8ecff;
  --yellow: #f4a261; --yellow-light: #fff3e0;
  --text: #1a1a2e; --muted: #888680;
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 40px; }

.topbar { background: var(--accent); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo { background: var(--red); border-radius: 6px; padding: 5px 7px; font-weight: 700; font-size: 10px; }
.topbar h1 { font-size: 16px; font-weight: 600; }
.topbar-right { position: relative; flex-shrink: 0; }
.hamburger-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; width: 36px; height: 36px; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.hamburger-btn:hover { background: rgba(255,255,255,0.22); }
.hamburger-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: var(--accent); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); min-width: 160px; overflow: hidden; z-index: 300; }
.hamburger-menu.open { display: block; }
.menu-item { display: flex; align-items: center; gap: 8px; padding: 13px 16px; font-size: 13px; font-weight: 500; color: white; text-decoration: none; background: none; border: none; width: 100%; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; transition: background 0.15s; }
.menu-item:hover { background: rgba(255,255,255,0.12); }
.menu-item + .menu-item { border-top: 1px solid rgba(255,255,255,0.08); }
.menu-item.danger { color: #ff8a8a; }

.content { padding: 16px; max-width: 600px; margin: 0 auto; }

/* 篩選 */
.filter-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.filter-chip { padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; background: var(--card); font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s; flex-shrink: 0; }
.filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }

/* 統計 */
.stats-row { display: flex; gap: 8px; margin-bottom: 14px; }
.stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.stat-chip strong { color: var(--text); }

/* 申請卡片 */
.req-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.req-card.pending { border-left: 3px solid var(--yellow); }
.req-card.approved { border-left: 3px solid var(--green); opacity: 0.7; }
.req-card.rejected { border-left: 3px solid var(--red); opacity: 0.7; }
.req-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.req-serial { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
.req-applicant { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.req-fields { font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--blue); }
.req-detail { font-size: 12px; color: var(--muted); line-height: 1.8; background: var(--bg); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.req-reason { font-size: 12px; color: var(--muted); line-height: 1.6; background: var(--yellow-light); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
.req-meta { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 10px; }
.req-actions { display: flex; gap: 8px; }
.req-btn { flex: 1; padding: 10px; border-radius: 9px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: all 0.15s; }
.btn-approve { background: var(--green-light); color: var(--green); }
.btn-approve:hover { background: var(--green); color: white; }
.btn-reject { background: #fff0f1; color: var(--red); }
.btn-reject:hover { background: var(--red); color: white; }

.badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-pending { background: var(--yellow-light); color: var(--yellow); }
.badge-approved { background: var(--green-light); color: var(--green); }
.badge-rejected { background: #fff0f1; color: var(--red); }

/* 審核 Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal-sheet { background: white; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-width: 600px; }
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; }
.modal-textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; resize: none; outline: none; margin-bottom: 10px; }
.modal-btns { display: flex; gap: 8px; }
.modal-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
.modal-cancel { background: var(--bg); color: var(--muted); }
.modal-approve { background: var(--green); color: white; }
.modal-reject { background: var(--red); color: white; }

.spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 32px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .icon { font-size: 36px; margin-bottom: 10px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: white; padding: 11px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 頁面分頁 */
.page-tabs { display: flex; gap: 0; margin-bottom: 14px; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--border); }
.page-tab { flex: 1; padding: 10px; border: none; background: var(--card); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; color: var(--muted); transition: all 0.15s; }
.page-tab.active { background: var(--accent); color: white; }
.page-tab + .page-tab { border-left: 1.5px solid var(--border); }
.tab-badge { display: inline-block; background: var(--red); color: white; border-radius: 10px; font-size: 10px; padding: 1px 6px; margin-left: 5px; vertical-align: middle; }

/* 作廢申請卡片 */
.void-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); border-left: 3px solid var(--red); }
.void-card.done { border-left: 3px solid var(--green); opacity: 0.7; }
.void-info-row { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-bottom: 5px; }
.void-info-row .label { color: var(--muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.void-meta { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin: 8px 0; }
.execute-btn { width: 100%; padding: 11px; background: var(--red); color: white; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
.execute-btn:hover { background: #c0333f; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Tandry</div>
    <h1>變更審核</h1>
  </div>
  <div class="topbar-right">
    <button class="hamburger-btn" onclick="toggleMenu(event)" aria-label="選單">☰</button>
    <div class="hamburger-menu" id="hamburgerMenu">
      <a href="報刀_v2.html" class="menu-item">✏️ 報刀</a>
      <a href="dashboard.html" class="menu-item">📋 總表</a>
      <a href="track.html" class="menu-item" id="trackBtn" style="display:none;">📌 追蹤</a>
      <a href="edit-request.html" class="menu-item" id="editRequestBtn" style="display:none;">✏️ 變更申請</a>
      <a href="pickup.html" class="menu-item" id="pickupBtn" style="display:none;">📦 抓貨管理</a>
      <a href="performance.html" class="menu-item" id="perfBtn" style="display:none;">📊 業績儀表板</a>
      <a href="doctor-habits.html" class="menu-item" id="doctorHabitsBtn" style="display:none;">👨‍⚕️ 醫師習慣</a>
      <a href="export.html" class="menu-item">📤 匯出統計表</a>
      <button class="menu-item danger" onclick="tandryLogout()">登出</button>
    </div>
  </div>
</div>

<!-- 審核 Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal-sheet">
    <div class="modal-title" id="modalTitle">審核申請</div>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <textarea class="modal-textarea" id="reviewNote" rows="3" placeholder="審核意見（選填）..."></textarea>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="content">
  <!-- 分頁切換 -->
  <div class="page-tabs">
    <button class="page-tab active" id="tabEdit" onclick="switchTab('edit')">✏️ 變更申請</button>
    <button class="page-tab" id="tabVoid" onclick="switchTab('void')">🗑 作廢申請 <span class="tab-badge" id="voidBadge" style="display:none;">0</span></button>
  </div>

  <!-- 變更申請 -->
  <div id="editSection">
    <div class="filter-row">
      <div class="filter-chip active" onclick="setFilter('全部')">全部</div>
      <div class="filter-chip" onclick="setFilter('待審核')">⏳ 待審核</div>
      <div class="filter-chip" onclick="setFilter('已核准')">✅ 已核准</div>
      <div class="filter-chip" onclick="setFilter('已拒絕')">❌ 已拒絕</div>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div id="reqList"><div class="spinner"></div></div>
  </div>

  <!-- 作廢申請 -->
  <div id="voidSection" style="display:none;">
    <div class="stats-row" id="voidStatsRow"></div>
    <div id="voidList"><div class="spinner"></div></div>
  </div>
</div>

<script>
// ── Token 驗證（只限 admin/manager）────────────
(function() {
  const token = localStorage.getItem('tandry_token');
  const exp = parseInt(localStorage.getItem('tandry_token_exp') || '0');
  if (!token || Date.now() >= exp) {
    window.TANDRY_USER = { role: 'admin', username: 'Ivan', displayName: 'Ivan' };
    return;
  }
  try { window.TANDRY_USER = JSON.parse(localStorage.getItem('tandry_user') || '{}'); }
  catch(e) { window.TANDRY_USER = {}; }
})();

function tandryLogout() {
  localStorage.removeItem('tandry_token');
  localStorage.removeItem('tandry_token_exp');
  localStorage.removeItem('tandry_user');
  window.location.href = 'login.html';
}

function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('hamburgerMenu').classList.toggle('open');
}
document.addEventListener('click', () => {
  const m = document.getElementById('hamburgerMenu');
  if (m) m.classList.remove('open');
});

// 選單可視範圍：sales 隱藏變更申請/審核/抓貨管理；業績儀表板全部可見（範圍在頁內依角色限制）
{
  const _role = (window.TANDRY_USER||{}).role || 'sales';
  const _isStaff = _role !== 'sales';
  const _show = (id,on)=>{ const el=document.getElementById(id); if(el) el.style.display = on?'flex':'none'; };
  _show('trackBtn', true);
  _show('perfBtn', true);
  _show('doctorHabitsBtn', true);
  _show('editRequestBtn', _isStaff);
  _show('reviewBtn', _isStaff);
  _show('pickupBtn', _isStaff);
}

const WEBHOOK_GET        = 'https://ydj.zeabur.app/webhook/get-edit-requests';
const WEBHOOK_REVIEW     = 'https://ydj.zeabur.app/webhook/review-edit';
const WEBHOOK_GET_VOID   = 'https://ydj.zeabur.app/webhook/get-void-requests';
const WEBHOOK_EXEC_VOID  = 'https://ydj.zeabur.app/webhook/execute-void';
const USER = window.TANDRY_USER || {};

let allRequests = [];
let allVoidRequests = [];
let currentFilter = '全部';
let pendingAction = null;
let currentTab = 'edit';

window.addEventListener('DOMContentLoaded', () => {
  loadRequests();
  loadVoidRequests();
  if (new URLSearchParams(location.search).get('tab') === 'void') switchTab('void');
});

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabEdit').classList.toggle('active', tab === 'edit');
  document.getElementById('tabVoid').classList.toggle('active', tab === 'void');
  document.getElementById('editSection').style.display = tab === 'edit' ? '' : 'none';
  document.getElementById('voidSection').style.display = tab === 'void' ? '' : 'none';
}

async function loadRequests() {
  document.getElementById('reqList').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(WEBHOOK_GET, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: USER.role, username: USER.username })
    });
    const data = await res.json();
    if (data.success) {
      allRequests = data.data || [];
      renderStats();
      renderList();
    } else {
      showError('載入失敗');
    }
  } catch(e) {
    showError('無法連線');
  }
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  renderList();
}

function renderStats() {
  const pending = allRequests.filter(r => r['狀態'] === '待審核').length;
  const approved = allRequests.filter(r => r['狀態'] === '已核准').length;
  const rejected = allRequests.filter(r => r['狀態'] === '已拒絕').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-chip">待審核 <strong>${pending}</strong></div>
    <div class="stat-chip">已核准 <strong>${approved}</strong></div>
    <div class="stat-chip">已拒絕 <strong>${rejected}</strong></div>
  `;
}

function renderList() {
  let list = allRequests;
  if (currentFilter !== '全部') {
    list = list.filter(r => r['狀態'] === currentFilter);
  }

  const el = document.getElementById('reqList');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="icon">📭</div><p>沒有${currentFilter === '全部' ? '' : currentFilter}的申請</p></div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const statusClass = r['狀態'] === '已核准' ? 'approved' : r['狀態'] === '已拒絕' ? 'rejected' : 'pending';
    const badgeClass = r['狀態'] === '已核准' ? 'badge-approved' : r['狀態'] === '已拒絕' ? 'badge-rejected' : 'badge-pending';
    const badgeText = r['狀態'] === '已核准' ? '✅ 已核准' : r['狀態'] === '已拒絕' ? '❌ 已拒絕' : '⏳ 待審核';
    const isPending = r['狀態'] === '待審核';

    const toArr = (v, sep) => Array.isArray(v) ? v : String(v ?? '').split(sep);
    const fields   = toArr(r['變更欄位'], '、');
    const origVals = toArr(r['原始值'],   '|');
    const newVals  = toArr(r['新值'],     '|');
    const detail = fields.map((f, i) => `<b>${f}</b>：${origVals[i] || '-'} → <span style="color:var(--blue);font-weight:600;">${newVals[i] || '-'}</span>`).join('<br>');

    return `
    <div class="req-card ${statusClass}">
      <div class="req-header">
        <div class="req-serial">${r['流水號'] || ''}</div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="req-applicant">申請人：${r['申請者'] || ''}</div>
      <div class="req-fields">變更欄位：${r['變更欄位'] || ''}</div>
      <div class="req-detail">${detail}</div>
      ${r['申請原因'] ? `<div class="req-reason">📝 申請原因：${r['申請原因']}</div>` : ''}
      ${r['審核備註'] ? `<div class="req-detail" style="background:${r['狀態']==='已核准'?'var(--green-light)':'#fff0f1'};">審核意見：${r['審核備註']}</div>` : ''}
      <div class="req-meta">${r['申請時間'] || ''}${r['審核時間'] ? ` → 審核 ${r['審核時間']}` : ''}</div>
      ${isPending ? `
      <div class="req-actions">
        <button class="req-btn btn-approve" onclick="openReview('${r['流水號']}','${r['申請時間']}','approve')">✅ 核准</button>
        <button class="req-btn btn-reject" onclick="openReview('${r['流水號']}','${r['申請時間']}','reject')">❌ 拒絕</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ── 審核 Modal ───────────────────────────────
function openReview(serial, applyTime, action) {
  pendingAction = { serial, applyTime, action };
  const isApprove = action === 'approve';
  document.getElementById('modalTitle').textContent = isApprove ? '✅ 核准申請' : '❌ 拒絕申請';
  document.getElementById('modalSubtitle').textContent = `${serial} · ${applyTime}`;
  document.getElementById('reviewNote').value = '';
  document.getElementById('reviewNote').placeholder = isApprove ? '審核意見（選填）...' : '請說明拒絕原因...';
  document.getElementById('modalBtns').innerHTML = `
    <button class="modal-btn modal-cancel" onclick="closeReviewModal()">取消</button>
    <button class="modal-btn ${isApprove ? 'modal-approve' : 'modal-reject'}" onclick="confirmReview()">
      ${isApprove ? '✅ 確認核准' : '❌ 確認拒絕'}
    </button>
  `;
  document.getElementById('reviewModal').classList.add('show');
}

function closeReviewModal() {
  document.getElementById('reviewModal').classList.remove('show');
  pendingAction = null;
}

async function confirmReview() {
  if (!pendingAction) return;
  const note = document.getElementById('reviewNote').value.trim();
  const { serial, applyTime, action } = pendingAction;

  try {
    const res = await fetch(WEBHOOK_REVIEW, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        流水號: serial,
        申請時間: applyTime,
        審核結果: action === 'approve' ? '核准' : '拒絕',
        審核者: USER.displayName || USER.username,
        審核備註: note,
        role: USER.role
      })
    });
    const data = await res.json();
    if (data.success) {
      closeReviewModal();
      showToast(action === 'approve' ? '✅ 已核准' : '❌ 已拒絕');
      await loadRequests();
    } else {
      showToast('❌ 審核失敗：' + (data.message || ''));
    }
  } catch(e) {
    showToast('❌ 無法連線');
  }
}

function showError(msg) {
  document.getElementById('reqList').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${msg}</p></div>`;
}

// ── 作廢申請 ──────────────────────────────────
async function loadVoidRequests() {
  document.getElementById('voidList').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(WEBHOOK_GET_VOID, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: USER.role, username: USER.username, token: localStorage.getItem('tandry_token') })
    });
    const data = await res.json();
    if (data.success) {
      allVoidRequests = data.data || [];
      renderVoidList();
    } else {
      document.getElementById('voidList').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>載入失敗</p></div>`;
    }
  } catch(e) {
    document.getElementById('voidList').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>無法連線</p></div>`;
  }
}

function renderVoidList() {
  const pending = allVoidRequests.filter(r => (r['狀態'] || '') === '待執行');
  const badge = document.getElementById('voidBadge');
  if (pending.length > 0) {
    badge.textContent = pending.length;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }

  document.getElementById('voidStatsRow').innerHTML = `
    <div class="stat-chip">待執行 <strong>${pending.length}</strong></div>
    <div class="stat-chip">已執行 <strong>${allVoidRequests.filter(r => r['狀態'] === '已執行').length}</strong></div>
  `;

  const el = document.getElementById('voidList');
  if (!allVoidRequests.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📭</div><p>沒有作廢申請</p></div>`;
    return;
  }

  el.innerHTML = allVoidRequests.map(r => {
    const isDone = r['狀態'] === '已執行';
    const isPending = !isDone;
    return `
    <div class="void-card ${isDone ? 'done' : ''}">
      <div class="req-header">
        <div class="req-serial">${r['流水號'] || ''}</div>
        <span class="badge ${isDone ? 'badge-approved' : 'badge-pending'}">${isDone ? '✅ 已執行' : '⏳ 待執行'}</span>
      </div>
      <div class="void-info-row">
        <div><div class="label">日期</div>${r['日期'] || '-'}</div>
        <div><div class="label">醫院</div>${r['醫院'] || '-'}</div>
        <div><div class="label">醫師</div>${r['醫師'] || '-'}</div>
        <div><div class="label">病人</div>${r['病人'] || '-'}</div>
        <div><div class="label">病歷號</div>${r['病歷號'] || '-'}</div>
      </div>
      <div class="void-meta">申請者：${r['申請者'] || ''} · ${r['申請時間'] || ''}${isDone ? ` → 執行者：${r['執行者'] || ''} · ${r['執行時間'] || ''}` : ''}</div>
      ${isPending ? `<button class="execute-btn" onclick="executeVoid('${r['流水號']}','${r['申請時間']}')">🗑 執行作廢</button>` : ''}
    </div>`;
  }).join('');
}

async function executeVoid(serial, applyTime) {
  if (!confirm(`確定執行作廢？\n流水號：${serial}\n\n此操作將從報表中移除該筆資料，無法還原。`)) return;
  try {
    const res = await fetch(WEBHOOK_EXEC_VOID, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: localStorage.getItem('tandry_token'),
        流水號: serial,
        申請時間: applyTime,
        執行者: USER.displayName || USER.username,
        role: USER.role
      })
    });
    const data = await res.json();
    if (data.success) {
      showToast('✅ 已執行作廢');
      loadVoidRequests();
    } else {
      showToast('❌ 執行失敗：' + (data.message || ''));
    }
  } catch(e) {
    showToast('❌ 無法連線');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
