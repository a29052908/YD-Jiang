<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>醫療險條款查詢</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 15px;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #1a3a5c;
      color: #fff;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #dde3ea;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .toolbar input[type="search"],
    .toolbar select {
      border: 1.5px solid #b0bec5;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      background: #fafbfc;
    }

    .toolbar input[type="search"] { flex: 1 1 180px; min-width: 150px; }
    .toolbar select { flex: 0 1 160px; min-width: 130px; }

    .toolbar input[type="search"]:focus,
    .toolbar select:focus { border-color: #1a3a5c; }

    #statusBar {
      font-size: 12px;
      color: #607d8b;
      padding: 6px 16px;
      background: #eef1f4;
    }

    .table-wrap {
      overflow-x: auto;
      padding: 0 0 60px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    thead {
      background: #1a3a5c;
      color: #fff;
      position: sticky;
      top: 57px; /* header height */
      z-index: 50;
    }

    thead th {
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: .02em;
    }

    tbody tr:nth-child(odd)  { background: #fff; }
    tbody tr:nth-child(even) { background: #f0f5fa; }

    tbody tr:hover { background: #dce8f5; transition: background .15s; }

    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid #e3e8ee;
      vertical-align: top;
      line-height: 1.5;
    }

    /* highlight first column */
    tbody td:first-child {
      font-weight: 600;
      color: #1a3a5c;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      background: #e3f0ff;
      color: #1a3a5c;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .no-data {
      text-align: center;
      padding: 48px 20px;
      color: #90a4ae;
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #607d8b;
    }

    mark {
      background: #fff176;
      border-radius: 2px;
      padding: 0 1px;
    }

    /* RWD: phone */
    @media (max-width: 640px) {
      header h1 { font-size: 1rem; }
      thead { top: 53px; }
      thead th, tbody td { padding: 8px 10px; font-size: 13px; }
      .toolbar { padding: 10px 12px; gap: 8px; }
    }
  </style>
</head>
<body>

<header>
  <h1>醫療險條款查詢工具</h1>
</header>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="搜尋保單名稱或保障項目…" />
  <select id="categoryFilter">
    <option value="">— 全部險種 —</option>
  </select>
</div>

<div id="statusBar">載入中…</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead>
      <tr>
        <th>保單名稱</th>
        <th>險種分類</th>
        <th>保障項目</th>
        <th>起賠條件</th>
        <th>給付金額</th>
        <th>等待期</th>
        <th>除外責任</th>
        <th>備註</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="8" class="loading">資料載入中，請稍候…</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ── 設定 ──────────────────────────────────────────────
  const SHEET_ID  = 'YOUR_SHEET_ID';          // ← 填入 Google Sheets ID
  const SHEET_GID = '0';                       // ← 如有多頁可調整 gid
  const CSV_URL   =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

  const COLUMNS = ['保單名稱','險種分類','保障項目','起賠條件','給付金額','等待期','除外責任','備註'];

  // ── 狀態 ──────────────────────────────────────────────
  let allRows = [];

  // ── CSV 解析（處理含引號/逗號/換行欄位）────────────────
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (inQuote) {
        if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
        else if (ch === '"')                  { inQuote = false; }
        else                                  { field += ch; }
      } else {
        if      (ch === '"')  { inQuote = true; }
        else if (ch === ',')  { row.push(field); field = ''; }
        else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (ch === '\r') { /* skip */ }
        else                  { field += ch; }
      }
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // ── 載入資料 ──────────────────────────────────────────
  async function loadData() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const [header, ...dataRows] = parseCSV(text);
      allRows = dataRows.filter(r => r.some(c => c.trim()));
      buildCategoryFilter();
      render();
    } catch (e) {
      document.getElementById('tableBody').innerHTML =
        `<tr><td colspan="8" class="no-data">⚠️ 無法載入資料：${e.message}<br>請確認 Sheets ID 正確且已公開發佈。</td></tr>`;
      document.getElementById('statusBar').textContent = '載入失敗';
    }
  }

  // ── 下拉選單建立 ──────────────────────────────────────
  function buildCategoryFilter() {
    const categories = [...new Set(allRows.map(r => (r[1] || '').trim()).filter(Boolean))].sort();
    const sel = document.getElementById('categoryFilter');
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  }

  // ── 高亮關鍵字 ────────────────────────────────────────
  function highlight(text, kw) {
    if (!kw) return escHtml(text);
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escHtml(text).replace(new RegExp(escaped, 'gi'),
      m => `<mark>${m}</mark>`);
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── 渲染表格 ──────────────────────────────────────────
  function render() {
    const kw  = document.getElementById('searchInput').value.trim().toLowerCase();
    const cat = document.getElementById('categoryFilter').value;

    let filtered = allRows.filter(r => {
      if (cat && (r[1] || '').trim() !== cat) return false;
      if (kw) {
        const name    = (r[0] || '').toLowerCase();
        const protect = (r[2] || '').toLowerCase();
        if (!name.includes(kw) && !protect.includes(kw)) return false;
      }
      return true;
    });

    const tbody = document.getElementById('tableBody');

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="no-data">找不到符合條件的保單</td></tr>`;
    } else {
      tbody.innerHTML = filtered.map(r => {
        const cells = COLUMNS.map((_, i) => {
          const val = (r[i] || '').trim();
          if (i === 1 && val) return `<td><span class="badge">${escHtml(val)}</span></td>`;
          if (i === 0 || i === 2)
            return `<td>${highlight(val, kw)}</td>`;
          return `<td>${escHtml(val)}</td>`;
        });
        return `<tr>${cells.join('')}</tr>`;
      }).join('');
    }

    const total   = allRows.length;
    const showing = filtered.length;
    const filters = [];
    if (kw)  filters.push(`關鍵字「${kw}」`);
    if (cat) filters.push(`險種「${cat}」`);
    document.getElementById('statusBar').textContent =
      filters.length
        ? `篩選條件：${filters.join('、')}　共 ${showing} / ${total} 筆`
        : `共 ${total} 筆`;
  }

  // ── 事件綁定 ──────────────────────────────────────────
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('categoryFilter').addEventListener('change', render);

  // ── 啟動 ──────────────────────────────────────────────
  loadData();
</script>
</body>
</html>
