<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>變更申請</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --border: #e0ddd6;
  --accent: #1a1a2e; --red: #e63946;
  --green: #2d6a4f; --green-light: #d8f3dc;
  --blue: #3a5bd9; --blue-light: #e8ecff;
  --yellow: #f4a261; --yellow-light: #fff3e0;
  --text: #1a1a2e; --muted: #888680;
  --radius: 12px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 40px; }

.topbar { background: var(--accent); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.logo { background: var(--red); border-radius: 6px; padding: 5px 7px; font-weight: 700; font-size: 10px; }
.topbar h1 { font-size: 16px; font-weight: 600; }
.nav-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; text-decoration: none; }

.content { padding: 16px; max-width: 480px; margin: 0 auto; }

.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--border);
  border-radius: 9px; font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
  outline: none; background: var(--bg); color: var(--text); transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); background: white; }
.field textarea { resize: none; line-height: 1.6; }

/* 欄位選擇 */
.field-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.field-chip { padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 500; cursor: pointer; background: white; transition: all 0.15s; font-family: 'Noto Sans TC', sans-serif; }
.field-chip.selected { background: var(--blue); border-color: var(--blue); color: white; }

/* 變更項目 */
.change-item { background: var(--bg); border-radius: 9px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
.change-item-header { font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.change-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.change-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; font-family: 'JetBrains Mono', monospace; }
.change-input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; font-family: 'Noto Sans TC', sans-serif; outline: none; background: white; }
.change-input:focus { border-color: var(--blue); }
.change-input.original { background: #fff0f1; border-color: #ffc0c4; color: var(--muted); }

/* 送出按鈕 */
.submit-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; margin-top: 4px; transition: all 0.2s; }
.submit-btn:hover { background: #2d2d4e; transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* 我的申請清單 */
.req-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.req-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.req-serial { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
.req-fields { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.req-detail { font-size: 12px; color: var(--muted); line-height: 1.7; background: var(--bg); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; }
.req-meta { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

.badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-pending { background: var(--yellow-light); color: var(--yellow); }
.badge-approved { background: var(--green-light); color: var(--green); }
.badge-rejected { background: #fff0f1; color: var(--red); }

/* tabs */
.tabs { display: flex; background: var(--card); border-radius: var(--radius); padding: 4px; margin-bottom: 14px; border: 1px solid var(--border); }
.tab-btn { flex: 1; padding: 9px; border: none; background: none; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 9px; font-family: 'Noto Sans TC', sans-serif; color: var(--muted); transition: all 0.2s; }
.tab-btn.active { background: var(--accent); color: white; font-weight: 600; }

.spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 32px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty .icon { font-size: 32px; margin-bottom: 10px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: white; padding: 11px 20px; border-radius: 24px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Tandry</div>
    <h1>變更申請</h1>
  </div>
  <div style="display:flex;gap:8px;">
    <a href="dashboard.html" class="nav-btn">📋 總表</a>
    <button onclick="tandryLogout()" class="nav-btn">登出</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="content">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('apply')">📝 新增申請</button>
    <button class="tab-btn" onclick="switchTab('history')">📋 我的申請</button>
  </div>

  <!-- 新增申請 -->
  <div id="applyTab">
    <div class="card">
      <div class="card-title">基本資訊</div>
      <div class="field">
        <label>流水號</label>
        <input type="text" id="serialInput" placeholder="如 IV26050801" style="font-family:'JetBrains Mono',monospace;">
      </div>
      <div class="field">
        <label>申請原因</label>
        <textarea id="reasonInput" rows="3" placeholder="說明為什麼需要變更..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">選擇要變更的欄位</div>
      <div class="field-chips" id="fieldChips">
        <div class="field-chip" data-field="日期" onclick="toggleField(this)">日期</div>
        <div class="field-chip" data-field="醫院" onclick="toggleField(this)">醫院</div>
        <div class="field-chip" data-field="醫師" onclick="toggleField(this)">醫師</div>
        <div class="field-chip" data-field="病人" onclick="toggleField(this)">病人</div>
        <div class="field-chip" data-field="病歷號" onclick="toggleField(this)">病歷號</div>
        <div class="field-chip" data-field="品號" onclick="toggleField(this)">品號</div>
        <div class="field-chip" data-field="數量" onclick="toggleField(this)">數量</div>
        <div class="field-chip" data-field="組件" onclick="toggleField(this)">組件</div>
        <div class="field-chip" data-field="工具" onclick="toggleField(this)">工具</div>
        <div class="field-chip" data-field="備註" onclick="toggleField(this)">備註</div>
      </div>
    </div>

    <div id="changeItems"></div>

    <button class="submit-btn" id="submitBtn" onclick="submitRequest()">📤 送出變更申請</button>
  </div>

  <!-- 我的申請 -->
  <div id="historyTab" style="display:none;">
    <div id="historyList"><div class="spinner"></div></div>
  </div>
</div>

<script>
// ── Token 驗證 ──────────────────────────────
(function() {
  const token = localStorage.getItem('tandry_token');
  const exp = parseInt(localStorage.getItem('tandry_token_exp') || '0');
  if (!token || Date.now() >= exp) {
    localStorage.removeItem('tandry_token');
    localStorage.removeItem('tandry_token_exp');
    localStorage.removeItem('tandry_user');
    window.location.href = 'login.html';
    return;
  }
  try { window.TANDRY_USER = JSON.parse(localStorage.getItem('tandry_user') || '{}'); }
  catch(e) { window.TANDRY_USER = {}; }
})();

function tandryLogout() {
  localStorage.removeItem('tandry_token');
  localStorage.removeItem('tandry_token_exp');
  localStorage.removeItem('tandry_user');
  window.location.href = 'login.html';
}

const WEBHOOK_SUBMIT = 'https://ydj.zeabur.app/webhook/submit-edit';
const WEBHOOK_GET    = 'https://ydj.zeabur.app/webhook/get-edit-requests';
const USER = window.TANDRY_USER || {};

let selectedFields = [];

// ── Tab 切換 ─────────────────────────────────
function switchTab(tab) {
  document.getElementById('applyTab').style.display = tab === 'apply' ? 'block' : 'none';
  document.getElementById('historyTab').style.display = tab === 'history' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'apply') || (i === 1 && tab === 'history'));
  });
  if (tab === 'history') loadHistory();
}

// ── 欄位選擇 ─────────────────────────────────
function toggleField(el) {
  const field = el.dataset.field;
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    selectedFields.push(field);
  } else {
    selectedFields = selectedFields.filter(f => f !== field);
  }
  renderChangeItems();
}

function renderChangeItems() {
  const container = document.getElementById('changeItems');
  if (selectedFields.length === 0) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = selectedFields.map(field => `
    <div class="change-item">
      <div class="change-item-header">${field}</div>
      <div class="change-row">
        <div>
          <div class="change-label">原始值</div>
          <input class="change-input original" id="orig_${field}" placeholder="目前的值">
        </div>
        <div>
          <div class="change-label">新值</div>
          <input class="change-input" id="new_${field}" placeholder="要改成...">
        </div>
      </div>
    </div>
  `).join('');
}

// ── 送出申請 ─────────────────────────────────
async function submitRequest() {
  const serial = document.getElementById('serialInput').value.trim();
  const reason = document.getElementById('reasonInput').value.trim();

  if (!serial) { showToast('❌ 請填寫流水號'); return; }
  if (selectedFields.length === 0) { showToast('❌ 請選擇要變更的欄位'); return; }

  const 變更欄位 = [];
  const 原始值 = [];
  const 新值 = [];

  for (const field of selectedFields) {
    const orig = document.getElementById(`orig_${field}`)?.value.trim() || '';
    const newVal = document.getElementById(`new_${field}`)?.value.trim() || '';
    if (!newVal) { showToast(`❌ 請填寫「${field}」的新值`); return; }
    變更欄位.push(field);
    原始值.push(orig);
    新值.push(newVal);
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '送出中...';

  try {
    const res = await fetch(WEBHOOK_SUBMIT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        流水號: serial,
        申請者: USER.displayName || USER.username,
        變更欄位, 原始值, 新值,
        申請原因: reason
      })
    });
    const data = await res.json();
    if (data.success) {
      showToast('✅ 申請已送出，等待主管審核');
      document.getElementById('serialInput').value = '';
      document.getElementById('reasonInput').value = '';
      selectedFields = [];
      document.querySelectorAll('.field-chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('changeItems').innerHTML = '';
    } else {
      showToast('❌ 送出失敗：' + (data.message || ''));
    }
  } catch(e) {
    showToast('❌ 無法連線');
  } finally {
    btn.disabled = false; btn.textContent = '📤 送出變更申請';
  }
}

// ── 我的申請 ─────────────────────────────────
async function loadHistory() {
  document.getElementById('historyList').innerHTML = '<div class="spinner"></div>';
  try {
    const res = await fetch(WEBHOOK_GET, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: USER.role, username: USER.username })
    });
    const data = await res.json();
    if (data.success) renderHistory(data.data || []);
    else document.getElementById('historyList').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>載入失敗</p></div>`;
  } catch(e) {
    document.getElementById('historyList').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>無法連線</p></div>`;
  }
}

function renderHistory(list) {
  const el = document.getElementById('historyList');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><div class="icon">📭</div><p>尚無申請記錄</p></div>`;
    return;
  }
  el.innerHTML = list.map(r => {
    const badgeClass = r['狀態'] === '已核准' ? 'badge-approved' : r['狀態'] === '已拒絕' ? 'badge-rejected' : 'badge-pending';
    const badgeText = r['狀態'] === '已核准' ? '✅ 已核准' : r['狀態'] === '已拒絕' ? '❌ 已拒絕' : '⏳ 待審核';
    const fields = (r['變更欄位'] || '').split('、');
    const origVals = (r['原始值'] || '').split('|');
    const newVals = (r['新值'] || '').split('|');
    const detail = fields.map((f, i) => `${f}：${origVals[i] || '-'} → ${newVals[i] || '-'}`).join('<br>');

    return `
    <div class="req-card">
      <div class="req-header">
        <div class="req-serial">${r['流水號'] || ''}</div>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="req-fields">變更：${r['變更欄位'] || ''}</div>
      <div class="req-detail">${detail}</div>
      ${r['申請原因'] ? `<div class="req-detail">原因：${r['申請原因']}</div>` : ''}
      ${r['審核備註'] ? `<div class="req-detail" style="background:${r['狀態']==='已核准'?'var(--green-light)':'#fff0f1'};">審核意見：${r['審核備註']}</div>` : ''}
      <div class="req-meta">${r['申請時間'] || ''}${r['審核時間'] ? ` → 審核 ${r['審核時間']}` : ''}</div>
    </div>`;
  }).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
