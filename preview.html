<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>報刀單預覽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f4f0;--card:#fff;--border:#e0ddd6;--accent:#1a1a2e;
  --text:#1a1a2e;--muted:#888680;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:40px;}
.topbar{background:var(--accent);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.logo{background:#e63946;border-radius:6px;padding:5px 7px;font-weight:700;font-size:10px;}
.topbar h1{font-size:16px;font-weight:600;}
.nav-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:white;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;text-decoration:none;}
.content{padding:16px;max-width:600px;margin:0 auto;}
.action-bar{display:flex;gap:8px;margin-bottom:16px;}
.action-btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.btn-back{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.btn-print{background:#065A82;color:white;}
.preview-wrap{background:white;border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;}
@media print{
  .topbar,.action-bar{display:none!important;}
  body{background:white;}
  .content{padding:0;max-width:none;}
  .preview-wrap{box-shadow:none;border-radius:0;}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Tandry</div>
    <h1>報刀單預覽</h1>
  </div>
  <button onclick="history.back()" class="nav-btn">← 返回</button>
</div>

<div class="content">
  <div class="action-bar">
    <button class="action-btn btn-back" onclick="history.back()">← 返回總表</button>
    <button class="action-btn btn-print" onclick="window.print()">🖨️ 列印 / PDF</button>
  </div>
  <div class="preview-wrap" id="previewContent"></div>
</div>

<script>
(function(){
  const token = localStorage.getItem('tandry_token');
  const exp = parseInt(localStorage.getItem('tandry_token_exp') || '0');
  if (!token || Date.now() >= exp) { window.location.href = 'login.html'; return; }
})();

const raw = sessionStorage.getItem('tandry_preview_data');
if (!raw) {
  document.getElementById('previewContent').innerHTML = '<p style="padding:24px;color:#888;">找不到預覽資料，請返回總表重新開啟。</p>';
} else {
  renderPreview(JSON.parse(raw));
}

function renderPreview(d) {
  const dateParts = (d.日期 || '').split('/');
  const yr = dateParts[0] ? (parseInt(dateParts[0]) - 1911) + '年' : '';
  const mo = dateParts[1] ? dateParts[1] + '月' : '';
  const dy = dateParts[2] ? dateParts[2] + '日' : '';
  const cb = t => t === (d.單據類型 || '出貨') ? '☑' : '☐';

  let implantLines = [];
  let innerCodeLines = [];
  const icMap = {};
  (d.productItems || []).forEach(item => {
    const buwei = item.buwei || '';
    const spec = item.spec || '';
    const pn = item['品號'] || '';
    const qty = item.qty || 1;
    const ic = item.innerCode || '';
    const neg = item.另洽 ? '（另洽）' : '';
    const dhs = item.dhsNote || '';
    const pay = item.payNote || '';
    const payTag = pay ? ` [${pay}]` : '';
    implantLines.push(`${buwei}${spec ? ' ' + spec : ''}${pn ? ' (' + pn + ')' : ''}${payTag}${qty > 1 ? ' ×' + qty : ''}${dhs ? ' | ' + dhs : ''}`.trim());
    if (ic) { const k = `${ic}${neg}`; if (!icMap[k]) icMap[k] = { ic, neg, qty: 0 }; icMap[k].qty += qty; }
  });
  innerCodeLines = Object.values(icMap).map(({ ic, neg, qty }) => `${ic}${neg}${qty > 1 ? ' ×' + qty : ''}`);

  document.getElementById('previewContent').innerHTML = `
  <div style="padding:16px;font-family:'Noto Sans TC',sans-serif;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;" border="1">
      <tr><td colspan="4" style="text-align:center;font-size:15px;font-weight:700;padding:8px;">星泓股份有限公司 手術報刀單</td></tr>
      <tr>
        <td style="padding:6px 8px;width:25%;font-weight:600;">日期</td>
        <td style="padding:6px 8px;">${yr}${mo}${dy}</td>
        <td style="padding:6px 8px;font-weight:600;">流水號</td>
        <td style="padding:6px 8px;font-family:'JetBrains Mono',monospace;">${d.流水號 || ''}</td>
      </tr>
      <tr>
        <td style="padding:6px 8px;font-weight:600;">醫院</td>
        <td style="padding:6px 8px;">${d.醫院 || ''}</td>
        <td style="padding:6px 8px;font-weight:600;">醫師</td>
        <td style="padding:6px 8px;">${d.醫師 || ''}</td>
      </tr>
      <tr>
        <td style="padding:6px 8px;font-weight:600;">病人</td>
        <td style="padding:6px 8px;">${d.病人 || ''}</td>
        <td style="padding:6px 8px;font-weight:600;">病歷號</td>
        <td style="padding:6px 8px;font-family:'JetBrains Mono',monospace;">${d.病歷號 || ''}</td>
      </tr>
      <tr>
        <td style="padding:6px 8px;font-weight:600;">業務</td>
        <td style="padding:6px 8px;">${d.業務 || ''}</td>
        <td style="padding:6px 8px;font-weight:600;">庫別</td>
        <td style="padding:6px 8px;">${d.庫別 || ''}</td>
      </tr>
      <tr>
        <td colspan="4" style="padding:6px 8px;">
          ${cb('出貨')} 出貨 &nbsp; ${cb('借貨')} 借貨 &nbsp; ${cb('換貨')} 換貨 &nbsp; ${cb('還貨')} 還貨
        </td>
      </tr>
      <tr>
        <td style="padding:6px 8px;font-weight:600;">植入物</td>
        <td colspan="3" style="padding:6px 8px;">
          <pre style="font-family:'Noto Sans TC',monospace;font-size:13px;line-height:2;white-space:pre-wrap;word-break:break-all;margin:0;">${implantLines.join('\n')}</pre>
        </td>
      </tr>
      <tr>
        <td style="padding:6px 8px;font-weight:600;">院內碼</td>
        <td colspan="3" style="padding:6px 8px;">
          <pre style="font-family:'JetBrains Mono',monospace;font-size:13px;line-height:2;white-space:pre-wrap;margin:0;">${innerCodeLines.join('\n')}</pre>
        </td>
      </tr>
      ${d.釘子明細 ? `<tr><td style="padding:6px 8px;font-weight:600;">釘子</td><td colspan="3" style="padding:6px 8px;"><pre style="font-family:'JetBrains Mono',monospace;font-size:12px;white-space:pre-wrap;margin:0;">${d.釘子明細}</pre></td></tr>` : ''}
      ${d.備註 ? `<tr><td style="padding:6px 8px;font-weight:600;">備註</td><td colspan="3" style="padding:6px 8px;">${d.備註}</td></tr>` : ''}
      <tr>
        <td style="padding:6px 8px;font-weight:600;">組件</td>
        <td colspan="2" style="padding:6px 8px;min-height:60px;">
          <pre style="font-family:'Noto Sans TC',monospace;font-size:13px;line-height:2;white-space:pre-wrap;word-break:break-all;margin:0;">${d.組件 || ''}</pre>
        </td>
        <td style="padding:6px 8px;min-height:60px;">
          <div style="font-weight:600;font-size:12px;margin-bottom:4px;">工具：</div>
          <div style="font-family:monospace;font-size:12px;white-space:pre-wrap;line-height:1.8;">${d.工具 || ''}</div>
        </td>
      </tr>
      <tr>
        <td colspan="4" style="padding:8px;font-size:11px;text-align:center;">
          主管：＿＿＿＿ &nbsp; 會計：＿＿＿＿ &nbsp; 倉管：＿＿＿＿ &nbsp; 業務：${d.業務 || ''} &nbsp; 客戶簽收：＿＿＿＿＿
        </td>
      </tr>
    </table>
  </div>`;
}
</script>
</body>
</html>
